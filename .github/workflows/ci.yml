name: ci

# R-06: every third-party action is pinned to a full commit SHA (tag in the trailing comment),
#       the workflow token starts with no permissions and each job asks only for what it needs.
# R-07: the pytest job runs the test suite on every pull request.
# R-01: the ci-gate job is the single status check the main ruleset requires.
#
# pull_request (not pull_request_target): code from forks never runs with repository secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ShellCheck every tracked shell script
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report when the repository has no Dockerfile
        if: hashFiles('Dockerfile') == ''
        run: echo "::notice::No Dockerfile in the repository root, Hadolint has nothing to lint yet."
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        if: hashFiles('Dockerfile') != ''
        with:
          dockerfile: Dockerfile

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep at the pinned version
        run: python -m pip install --no-input -r requirements-semgrep.txt
      - name: Scan with registry rule packs for Actions, Python and secrets
        run: |
          semgrep scan --error --metrics=off \
            --config p/github-actions --config p/python --config p/secrets .

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --no-input -r requirements-dev.txt
      - name: Run the tests with digest checks enforced
        env:
          STRICT_DIGESTS: "1"
        run: python -m pytest -q

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # One required check for the ruleset. It fails when any job above failed or was cancelled.
  ci-gate:
    if: ${{ always() }}
    needs: [shellcheck, hadolint, semgrep, trivy, pytest, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            [ "${r}" = "success" ] || { echo "::error::A required job did not succeed."; exit 1; }
          done

  # Runs only for a pushed v* tag. Signs with the workflow's OIDC identity (no stored key),
  # then verifies its own signature before it publishes the release.
  release:
    if: ${{ github.ref_type == 'tag' }}
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build the source archive
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="un_repo-${TAG}/" -o "un_repo-${TAG}.tar.gz" "refs/tags/${TAG}"
      - name: Sign the archive and the SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for f in sbom.spdx.json "un_repo-${TAG}.tar.gz"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done
      - name: Verify the signatures against this workflow's identity
        env:
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          for f in sbom.spdx.json "un_repo-${TAG}.tar.gz"; do
            cosign verify-blob \
              --bundle "${f}.sigstore.json" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${f}"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "Signed with cosign (keyless). Verify with the commands in docs/ci-runbook.md." \
            sbom.spdx.json sbom.spdx.json.sigstore.json \
            "un_repo-${TAG}.tar.gz" "un_repo-${TAG}.tar.gz.sigstore.json"

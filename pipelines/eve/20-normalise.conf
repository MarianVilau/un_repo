# Stage 2, normalise to Elastic Common Schema (R-07).
# A line that cannot be parsed, or is too large, keeps its original text and gets the tag
# _parse_failure. It is never dropped. tests/test_eve_pipeline.py checks this file against
# detections/ecs_eve.py, the reference mapping used by the tests.
filter {
  ruby {
    code => '
      max = (ENV["EVE_MAX_LINE_BYTES"] || "16384").to_i
      msg = event.get("message")
      if msg.nil? || msg.bytesize > max
        event.tag("_parse_failure")
        event.tag("_oversized") unless msg.nil?
      end
    '
  }

  if "_parse_failure" not in [tags] {
    json {
      source => "message"
      target => "eve"
      tag_on_failure => ["_parse_failure"]
    }
  }

  if "_parse_failure" not in [tags] {
    date {
      match => ["[eve][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      lowercase => ["[eve][proto]"]
    }

    mutate {
      rename => {
        "[eve][src_ip]" => "[source][ip]"
        "[eve][src_port]" => "[source][port]"
        "[eve][dest_ip]" => "[destination][ip]"
        "[eve][dest_port]" => "[destination][port]"
        "[eve][proto]" => "[network][transport]"
        "[eve][alert][signature_id]" => "[rule][id]"
        "[eve][alert][signature]" => "[rule][name]"
        "[eve][alert][category]" => "[rule][category]"
        "[eve][alert][severity]" => "[event][severity]"
        "[eve][http][hostname]" => "[url][domain]"
        "[eve][http][url]" => "[url][original]"
        "[eve][http][http_user_agent]" => "[user_agent][original]"
        "[eve][http][http_method]" => "[http][request][method]"
        "[eve][http][status]" => "[http][response][status_code]"
      }
      add_field => {
        "[event][module]" => "eve"
        "[event][dataset]" => "eve.%{[eve][event_type]}"
      }
    }

    if [eve][event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]" => "alert"
          "[event][category]" => "network"
        }
      }
    }
  }
}

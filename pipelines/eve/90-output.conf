# Stage 4, output (R-07, R-08). Hosts, port and credentials come from the environment.
# The password is read from .env.secrets, which `make secrets` decrypts from the SOPS file.
# Certificate checks are off because the lab OpenSearch uses the demo certificate of the image.
output {
  opensearch {
    hosts => ["https://${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
    user => "${OPENSEARCH_USER}"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl_certificate_verification => false
    index => "eve-lab-%{+YYYY.MM.dd}"
  }
}

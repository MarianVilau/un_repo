# Stage 3, enrich with MISP indicators (R-09). Reads ECS fields only, adds fields only.
# The dictionary is written by threatintel/misp_lookup.py. Logstash rereads it when the
# file changes, so a feed refresh needs no restart. A missing file is a logged error and the
# event passes through unenriched, never dropped.
filter {
  if "_parse_failure" not in [tags] and [source][ip] {
    translate {
      source => "[source][ip]"
      target => "[threat][indicator][provider]"
      dictionary_path => "${MISP_DICTIONARY_PATH}"
      refresh_interval => 300
    }

    if [threat][indicator][provider] {
      mutate {
        add_field => { "[threat][indicator][matched]" => "true" }
      }
      mutate {
        convert => { "[threat][indicator][matched]" => "boolean" }
      }
    }
  }
}

# Prometheus for the lab (R-10). Scrape every 15 s, evaluate rules every 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # TCP probe of each lab service through the blackbox exporter. The address under test
  # becomes the `instance` label, the scrape itself goes to the exporter.
  - job_name: lab-services
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - opensearch:9200
          - opensearch-dashboards:5601
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
